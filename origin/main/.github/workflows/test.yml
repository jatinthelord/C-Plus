name: C+ Compiler Regression Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
    - name: Checkout Source Tree
      uses: actions/checkout@v4

    - name: Compile C+ Compiler (cspc.exe)
      run: |
        g++ -std=c++20 -O2 cspc.cpp src/lexer.cpp src/parser.cpp -o cspc.exe

    - name: Run Architecture & Assembly Regressions
      run: |
        ./cspc.exe hello.csp --check
        echo "Frontend semantic checks passed!"
